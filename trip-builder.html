<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Trip Coordination Builder</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #0F1A24;
    --panel: #16232E;
    --panel-raised: #1C2C39;
    --line: #2A3B47;
    --text: #E8EDF0;
    --text-dim: #8CA0AC;
    --amber: #E8A33D;
    --teal: #4FA8A0;
    --danger: #D9695A;
    --font-display: 'Space Grotesk', system-ui, sans-serif;
    --font-mono: 'IBM Plex Mono', ui-monospace, Menlo, monospace;
  }
  :root:not([data-theme="light"]){ }
  @media (prefers-color-scheme: light){
    :root:not([data-theme="dark"]){
      --bg: #EEF1F0;
      --panel: #FFFFFF;
      --panel-raised: #F6F8F7;
      --line: #D3DBD8;
      --text: #16232E;
      --text-dim: #5B6B72;
      --amber: #B4741E;
      --teal: #2E7D74;
      --danger: #B0392C;
    }
  }
  :root[data-theme="light"]{
    --bg: #EEF1F0;
    --panel: #FFFFFF;
    --panel-raised: #F6F8F7;
    --line: #D3DBD8;
    --text: #16232E;
    --text-dim: #5B6B72;
    --amber: #B4741E;
    --teal: #2E7D74;
    --danger: #B0392C;
  }

  *{ box-sizing: border-box; }
  body{
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: var(--font-mono);
    padding: 32px 16px 80px;
    -webkit-font-smoothing: antialiased;
  }
  .wrap{
    max-width: 760px;
    margin: 0 auto;
  }
  header.top{
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    border-bottom: 2px solid var(--amber);
    padding-bottom: 14px;
    margin-bottom: 28px;
    flex-wrap: wrap;
    gap: 8px;
  }
  header.top h1{
    font-family: var(--font-display);
    font-size: 22px;
    font-weight: 700;
    margin: 0;
    letter-spacing: 0.2px;
  }
  header.top .tag{
    font-size: 12px;
    color: var(--text-dim);
  }
  .section{
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 3px;
    padding: 18px 20px;
    margin-bottom: 18px;
  }
  .section h2{
    font-family: var(--font-display);
    font-size: 14px;
    font-weight: 600;
    margin: 0 0 14px;
    color: var(--amber);
    display: flex;
    align-items: baseline;
    justify-content: space-between;
  }
  .section h2 .hint{
    font-size: 11px;
    font-weight: 400;
    color: var(--text-dim);
    font-family: var(--font-mono);
  }
  .grid{
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 12px;
  }
  .field{ margin-bottom: 12px; }
  .field label{
    display: block;
    font-size: 11px;
    color: var(--text-dim);
    margin-bottom: 5px;
  }
  .field input, .field select{
    width: 100%;
    background: var(--panel-raised);
    border: 1px solid var(--line);
    color: var(--text);
    padding: 8px 10px;
    font-family: var(--font-mono);
    font-size: 13.5px;
    border-radius: 2px;
  }
  .field input:focus, .field select:focus{
    outline: 2px solid var(--teal);
    outline-offset: -1px;
  }
  .leg, .stop{
    border: 1px solid var(--line);
    border-radius: 2px;
    padding: 14px;
    margin-bottom: 10px;
    background: var(--panel-raised);
    position: relative;
  }
  .leg-row{
    display: grid;
    grid-template-columns: 1.4fr 1fr 1fr 0.8fr 0.6fr;
    gap: 8px;
  }
  .row-index{
    position: absolute;
    top: -10px;
    left: 12px;
    background: var(--teal);
    color: var(--bg);
    font-size: 10px;
    padding: 1px 7px;
    border-radius: 2px;
    font-weight: 600;
  }
  .remove-btn{
    position: absolute;
    top: 10px;
    right: 10px;
    background: none;
    border: none;
    color: var(--danger);
    cursor: pointer;
    font-size: 16px;
    line-height: 1;
    padding: 2px 6px;
  }
  .remove-btn:hover{ opacity: 0.7; }
  .checks{
    display: flex;
    flex-wrap: wrap;
    gap: 10px 16px;
    margin-top: 10px;
  }
  .checks label{
    display: flex;
    align-items: center;
    gap: 6px;
    font-size: 12.5px;
    color: var(--text);
    cursor: pointer;
  }
  .checks input[type=checkbox]{
    accent-color: var(--teal);
    width: 14px;
    height: 14px;
  }
  .other-note{ margin-top: 10px; }
  .add-btn{
    background: none;
    border: 1px dashed var(--line);
    color: var(--teal);
    padding: 8px 12px;
    font-family: var(--font-mono);
    font-size: 12.5px;
    border-radius: 2px;
    cursor: pointer;
    width: 100%;
  }
  .add-btn:hover{ border-color: var(--teal); }
  .toggle-row{
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 13px;
    margin-bottom: 4px;
  }
  .toggle-row input{ accent-color: var(--teal); width: 15px; height: 15px; }
  .generate-btn{
    width: 100%;
    background: var(--amber);
    color: #1A1204;
    border: none;
    padding: 14px;
    font-family: var(--font-display);
    font-weight: 700;
    font-size: 15px;
    border-radius: 3px;
    cursor: pointer;
    margin: 6px 0 24px;
  }
  .generate-btn:hover{ filter: brightness(1.08); }
  .output-wrap{ display: none; }
  .output-wrap.show{ display: block; }
  .output-head{
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 8px;
  }
  .output-head h2{
    font-family: var(--font-display);
    font-size: 14px;
    color: var(--teal);
    margin: 0;
  }
  .copy-btn{
    background: var(--panel-raised);
    border: 1px solid var(--teal);
    color: var(--teal);
    padding: 6px 12px;
    font-family: var(--font-mono);
    font-size: 12px;
    border-radius: 2px;
    cursor: pointer;
  }
  .copy-btn.copied{ background: var(--teal); color: var(--bg); }
  #output{
    width: 100%;
    min-height: 360px;
    background: var(--panel);
    border: 1px solid var(--line);
    color: var(--text);
    font-family: var(--font-mono);
    font-size: 12.8px;
    line-height: 1.55;
    padding: 16px;
    border-radius: 3px;
    white-space: pre-wrap;
    resize: vertical;
  }
  footer.note{
    text-align: center;
    color: var(--text-dim);
    font-size: 11px;
    margin-top: 20px;
  }
  @media (max-width: 560px){
    .grid{ grid-template-columns: 1fr; }
    .leg-row{ grid-template-columns: 1fr 1fr; }
  }
</style>
</head>
<body>
<div class="wrap">

  <header class="top">
    <h1>✈ Trip Coordination Builder</h1>
    <span class="tag">generates dispatch email text</span>
  </header>

  <div class="section">
    <h2>Trip basics</h2>
    <div class="grid">
      <div class="field">
        <label for="tail">Tail number</label>
        <select id="tail" onchange="toggleOther('tail')">
          <option value="N604GW">N604GW</option>
          <option value="N500M">N500M</option>
          <option value="N109GX">N109GX</option>
          <option value="__other">Other…</option>
        </select>
        <input id="tail_other" placeholder="Enter tail number" style="display:none; margin-top:6px;">
      </div>
      <div class="field">
        <label for="pax">Passenger count</label>
        <input id="pax" placeholder="TBD" value="TBD">
      </div>
      <div class="field">
        <label for="pic">PIC</label>
        <select id="pic" onchange="toggleOther('pic')">
          <option value="Nathan Harbstreit">Nathan Harbstreit</option>
          <option value="Tim Gehres">Tim Gehres</option>
          <option value="Jeff Sprague">Jeff Sprague</option>
          <option value="Micah Briner">Micah Briner</option>
          <option value="Kent Anderson">Kent Anderson</option>
          <option value="Zach Cash">Zach Cash</option>
          <option value="__other">Other…</option>
        </select>
        <input id="pic_other" placeholder="Enter name" style="display:none; margin-top:6px;">
      </div>
      <div class="field">
        <label for="sic">SIC</label>
        <select id="sic" onchange="toggleOther('sic')">
          <option value="Nathan Harbstreit">Nathan Harbstreit</option>
          <option value="Tim Gehres">Tim Gehres</option>
          <option value="Jeff Sprague">Jeff Sprague</option>
          <option value="Micah Briner">Micah Briner</option>
          <option value="Kent Anderson">Kent Anderson</option>
          <option value="Zach Cash">Zach Cash</option>
          <option value="__other">Other…</option>
        </select>
        <input id="sic_other" placeholder="Enter name" style="display:none; margin-top:6px;">
      </div>
    </div>
  </div>

  <div class="section">
    <h2>Itinerary <span class="hint">one card per leg</span></h2>
    <div id="legs"></div>
    <button class="add-btn" onclick="addLeg()">+ Add leg</button>
  </div>

  <div class="section">
    <h2>Ground coordination <span class="hint">one card per stop</span></h2>
    <div id="stops"></div>
    <button class="add-btn" onclick="addStop()">+ Add stop</button>
  </div>

  <div class="section">
    <h2>Flight planning</h2>
    <div class="grid">
      <div class="field">
        <label for="planFrom">Planning begins at</label>
        <input id="planFrom" placeholder="KGSO">
      </div>
      <div class="field">
        <label for="fuelReserve">Arrival fuel reserve</label>
        <input id="fuelReserve" placeholder="4,000 lbs" value="4,000 lbs">
      </div>
    </div>
    <div class="field">
      <label for="noplan">Legs needing no flight planning (optional)</label>
      <input id="noplan" placeholder="KBMG → KGSO or KGSO → KBMG">
    </div>
    <div class="toggle-row">
      <input type="checkbox" id="askParking" checked>
      <label for="askParking">Ask them to confirm parking availability</label>
    </div>
  </div>

  <button class="generate-btn" onclick="generate()">Generate email</button>

  <div class="output-wrap" id="outputWrap">
    <div class="output-head">
      <h2>Generated email</h2>
      <button class="copy-btn" id="copyBtn" onclick="copyOutput()">Copy</button>
    </div>
    <textarea id="output" readonly></textarea>
  </div>

  <footer class="note">Fill in what applies · leave anything blank to skip it</footer>
</div>

<script>
let legCount = 0;
let stopCount = 0;

function toggleOther(fieldId){
  const select = document.getElementById(fieldId);
  const other = document.getElementById(fieldId + '_other');
  other.style.display = (select.value === '__other') ? 'block' : 'none';
}

function valueOf(fieldId){
  const select = document.getElementById(fieldId);
  if(select.value === '__other'){
    return document.getElementById(fieldId + '_other').value.trim();
  }
  return select.value.trim();
}

function addLeg(prefill){
  legCount++;
  const id = 'leg' + legCount;
  const div = document.createElement('div');
  div.className = 'leg';
  div.id = id;
  div.innerHTML = `
    <span class="row-index">LEG ${legCount}</span>
    <button class="remove-btn" onclick="document.getElementById('${id}').remove()">&times;</button>
    <div class="field" style="margin-top:14px;">
      <label>Day / date</label>
      <input class="leg-day" placeholder="Tuesday, Sept 22">
    </div>
    <div class="leg-row">
      <div class="field">
        <label>Origin ICAO</label>
        <input class="leg-orig" placeholder="KGSO">
      </div>
      <div class="field">
        <label>Dest ICAO</label>
        <input class="leg-dest" placeholder="SKRG">
      </div>
      <div class="field">
        <label>Time</label>
        <input class="leg-time" placeholder="0750">
      </div>
      <div class="field">
        <label>TZ letter</label>
        <input class="leg-tz" placeholder="L" value="L">
      </div>
      <div class="field">
        <label>Intl?</label>
        <select class="leg-intl">
          <option value="yes" selected>Yes</option>
          <option value="no">No</option>
        </select>
      </div>
    </div>
  `;
  document.getElementById('legs').appendChild(div);
}

function addStop(prefill){
  stopCount++;
  const id = 'stop' + stopCount;
  const div = document.createElement('div');
  div.className = 'stop';
  div.id = id;
  div.innerHTML = `
    <span class="row-index">STOP ${stopCount}</span>
    <button class="remove-btn" onclick="document.getElementById('${id}').remove()">&times;</button>
    <div class="field" style="margin-top:14px;">
      <label>Airport ICAO</label>
      <input class="stop-icao" placeholder="MROC">
    </div>
    <div class="checks">
      <label><input type="checkbox" class="chk-customs-io"> Inbound &amp; outbound customs/immigration</label>
      <label><input type="checkbox" class="chk-customs-std"> Customs/immigration + standard handling</label>
      <label><input type="checkbox" class="chk-handling"> Standard handling only</label>
      <label><input type="checkbox" class="chk-car"> Car &amp; driver (crew to/from hotel)</label>
      <label><input type="checkbox" class="chk-lav"> Lav service</label>
      <label><input type="checkbox" class="chk-catering"> Catering</label>
      <label><input type="checkbox" class="chk-gpu"> GPU</label>
    </div>
    <div class="field other-note">
      <label>Other / notes for this stop</label>
      <input class="stop-other" placeholder="e.g. hotel booking, overflight permits">
    </div>
  `;
  document.getElementById('stops').appendChild(div);
}

function generate(){
  const tail = valueOf('tail') || '[TAIL NUMBER]';
  const pax = document.getElementById('pax').value.trim() || 'TBD';
  const pic = valueOf('pic') || '[PIC]';
  const sic = valueOf('sic');

  let lines = [];
  lines.push('Good morning,');
  lines.push('');
  lines.push(`We have an upcoming trip in ${tail} and would like to get the preliminary arrangements started. Passenger count is ${pax} at this time.`);
  lines.push('');
  lines.push('Crew:');
  lines.push(`PIC – ${pic}`);
  if(sic) lines.push(`SIC – ${sic}`);
  lines.push('');
  lines.push('Itinerary:');
  lines.push('');

  let lastDay = null;
  document.querySelectorAll('.leg').forEach(leg => {
    const day = leg.querySelector('.leg-day').value.trim();
    const orig = leg.querySelector('.leg-orig').value.trim();
    const dest = leg.querySelector('.leg-dest').value.trim();
    const time = leg.querySelector('.leg-time').value.trim();
    const tz = leg.querySelector('.leg-tz').value.trim() || 'L';
    if(!orig && !dest && !day) return;
    if(day && day !== lastDay){
      lines.push(day);
      lastDay = day;
    }
    lines.push(`${orig} → ${dest} – ${time}${tz} departure`);
  });

  lines.push('');
  lines.push('Please coordinate the following:');
  lines.push('');
  document.querySelectorAll('.stop').forEach(stop => {
    const icao = stop.querySelector('.stop-icao').value.trim();
    if(!icao) return;
    const bits = [];
    if(stop.querySelector('.chk-customs-io').checked) bits.push('Inbound and outbound customs/immigration');
    if(stop.querySelector('.chk-customs-std').checked) bits.push('Inbound and outbound customs/immigration and standard handling');
    if(stop.querySelector('.chk-handling').checked) bits.push('Standard handling');
    if(stop.querySelector('.chk-car').checked) bits.push('Car and driver for crew transportation to and from the hotel');
    if(stop.querySelector('.chk-lav').checked) bits.push('Lav service');
    if(stop.querySelector('.chk-catering').checked) bits.push('Catering');
    if(stop.querySelector('.chk-gpu').checked) bits.push('GPU');
    const other = stop.querySelector('.stop-other').value.trim();
    if(other) bits.push(other);
    bits.forEach(b => lines.push(`${icao}: ${b}`));
  });

  lines.push('');

  const planFrom = document.getElementById('planFrom').value.trim();
  const fuelReserve = document.getElementById('fuelReserve').value.trim() || '4,000 lbs';
  if(planFrom){
    lines.push(`Flight planning: Please provide planning beginning with ${planFrom} and for all subsequent international legs. Plan to arrive at each stop with ${fuelReserve} of fuel remaining.`);
    lines.push('');
  }

  const noplan = document.getElementById('noplan').value.trim();
  if(noplan){
    lines.push(`No flight planning is needed for the ${noplan} legs.`);
    lines.push('');
  }

  if(document.getElementById('askParking').checked){
    lines.push('Please confirm parking availability.');
    lines.push('');
  }

  if(pax === 'TBD'){
    lines.push('Passenger count will be provided once confirmed.');
    lines.push('');
  }

  lines.push('Please let us know if you need anything else at this time.');

  document.getElementById('output').value = lines.join('\n');
  document.getElementById('outputWrap').classList.add('show');
  document.getElementById('outputWrap').scrollIntoView({behavior:'smooth', block:'start'});
}

function copyOutput(){
  const out = document.getElementById('output');
  out.select();
  navigator.clipboard.writeText(out.value).then(() => {
    const btn = document.getElementById('copyBtn');
    btn.textContent = 'Copied';
    btn.classList.add('copied');
    setTimeout(() => { btn.textContent = 'Copy'; btn.classList.remove('copied'); }, 1500);
  });
}

// seed with two legs and one stop to start
addLeg();
addLeg();
addStop();
</script>
</body>
</html>
